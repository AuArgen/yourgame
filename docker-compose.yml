version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ${PROJECT_NAME:-yourgame}_php
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - POSTGRES_DB=${DB_NAME:-yourgame}
      - POSTGRES_USER=${DB_USER:-user}
      - POSTGRES_PASSWORD=${DB_PASS:-pass}
      - DB_HOST=${DB_HOST:-db}
    networks:
      - yourgame_network

  nginx:
    image: nginx:stable-alpine
    container_name: ${PROJECT_NAME:-yourgame}_nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - yourgame_network

  db:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME:-yourgame}_db
    environment:
      - POSTGRES_DB=${DB_NAME:-yourgame}
      - POSTGRES_USER=${DB_USER:-user}
      - POSTGRES_PASSWORD=${DB_PASS:-pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - yourgame_network

networks:
  yourgame_network:
    driver: bridge

volumes:
  db_data:
